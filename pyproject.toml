[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-value-isomorph"
version = "0.1.0"
description = "PyTorch training and rollout-based reconstruction of game policies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]


[project.scripts]
policy-value-cli = "policy_value_isomorph.cli:main"

[project.optional-dependencies]
phase-iv = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]
phase-v = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]
neural-control = ["numpy>=1.24"]
muon = ["torch>=2.9"]
dev = [
  "pytest>=8.0",
  "numpy>=1.24",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
policy_value_isomorph = ["phase_v_rules.hpp", "phase_v_native.cpp", "win_vnm.hpp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA-enabled PyTorch installation and an available NVIDIA GPU"]
