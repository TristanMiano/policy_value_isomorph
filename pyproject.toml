[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-value-isomorph"
version = "0.1.0"
description = "Minimal tic-tac-toe policy-to-value reconstruction demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]


[project.scripts]
policy-value-cli = "policy_value_isomorph.cli:main"

[project.optional-dependencies]
neural-control = ["numpy>=1.24"]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA-enabled PyTorch installation and an available NVIDIA GPU"]
